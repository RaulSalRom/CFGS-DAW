<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Secuencia de imágenes</title>
</head>
<body>
  <h1>Haz clic en la imagen</h1>

  <img id="imagen" src="https://placehold.co/300x200?text=1" alt="Fotograma 1" onclick="cambiarImagen()">

  <script>
    const imagenes = [
      "https://placehold.co/300x200?text=1",
      "https://placehold.co/300x200?text=2",
      "https://placehold.co/300x200?text=3",
      "https://placehold.co/300x200?text=4"
    ];
    let indice = 0;

    function cambiarImagen() {
      indice++;

      if (indice === imagenes.length) {
        indice = 0;
      }

      document.getElementById("imagen").src = imagenes[indice];
    }
  </script>
</body>
</html>

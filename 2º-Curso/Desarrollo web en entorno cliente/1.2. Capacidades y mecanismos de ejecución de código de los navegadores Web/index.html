<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Secuencia de imágenes</title>
</head>
<body>
  <h1>Haz clic en la imagen</h1>

  <img id="img" src="https://placehold.co/300x200?text=1" style="cursor:pointer" onclick="
    if (img.src.match('text=1')) { img.src = 'https://placehold.co/300x200?text=2' }
    else if (img.src.match('text=2')) { img.src = 'https://placehold.co/300x200?text=3' }
    else if (img.src.match('text=3')) { img.src = 'https://placehold.co/300x200?text=4' }
    else { img.src = 'https://placehold.co/300x200?text=1' }">
</body>
</html>

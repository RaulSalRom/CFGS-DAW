<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 2 - Captura de Evento Clic</title>
</head>
<body>
  <p id="saludo">Hallo!.</p>

  <button type="button" onclick="document.getElementById('saludo').innerHTML = '¡Hola!'; document.getElementById('saludo').style.color = 'red';">
    Español
  </button>

 <button type="button" onclick="document.getElementById('saludo').innerHTML = 'Hello!'; document.getElementById('saludo').style.color = 'purple';">   
    Inglés
  </button>

   <button type="button" onclick="document.getElementById('saludo').innerHTML = 'Здравствуйте!'; document.getElementById('saludo').style.color = 'orange';">
    Ruso
  </button>
</body>
</html>

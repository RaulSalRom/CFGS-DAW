    let indice = 0;

    function cambiarImagenPositivo() {
      indice++;

      if (indice === imagenes.length) {
        indice = 0;
      }

      document.getElementById("imagen").src = imagenes[indice];
    }
     function cambiarImagenNegativo() {
      indice--;

      if (indice < 0) {
        indice = imagenes.length - 1;
      }

      document.getElementById("imagen").src = imagenes[indice];
    }
  </script>

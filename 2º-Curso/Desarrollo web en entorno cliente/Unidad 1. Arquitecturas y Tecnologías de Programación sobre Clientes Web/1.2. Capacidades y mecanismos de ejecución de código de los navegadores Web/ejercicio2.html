<!--Ejercicio 2: Implementar una página que capture el evento clic de un botón para 
emitir una traza informativa a las herramientas de desarrollo mediante console.log(). -->
<!DOCTYPE html> 
<html> 
<body> 
  
    <h1 id="encabezado">Modificando el codigo HTML</h1> 
  
    <p id="prueba">Modificando el contenido.</p> 

  <!-- Al hacer clic, document.getElementById localiza el nodo y cambia su texto interno --> 
    <button id="boton" type="button"; onclick="capturarEvento()"> 
        console.log
     </button> 

  <script>
    function capturarEvento(){
        console.log('Se ha hecho clic en el boton');
    }
  </script>
</body> 
</html>

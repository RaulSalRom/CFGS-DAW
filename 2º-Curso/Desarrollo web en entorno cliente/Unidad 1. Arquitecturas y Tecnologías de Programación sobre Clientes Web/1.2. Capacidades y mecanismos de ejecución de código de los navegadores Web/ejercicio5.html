
<!--Adaptar el mismo ejercicio para que las salidas en los tres idiomas se 
impriman únicamente a través de la consola de desarrollador.-->
<!DOCTYPE html> 
<html> 
<body> 
  
    <h1 id="encabezado">Modificando el codigo HTML</h1> 
    <p id="prueba">Modificando el contenido.</p>

    <button id="botonEspanol" type="button"; onclick="cambioEspanol()"> 
        Espanol
     </button> 
    <button id="botonIngles" type="button"; onclick="cambioIngles()"> 
        Ingles
     </button>
    <button id="botonRuso" type="button"; onclick="cambioRuso()"> 
        Ruso
     </button>
  <script>
    function cambioEspanol(){
        console.log("Hola");
    }
    function cambioIngles(){
        console.log("Hello");
    }
    function cambioRuso(){
        console.log("Привет");
    }
  </script>
</body> 
</html>

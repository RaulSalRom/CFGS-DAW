<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica puerto - Contenido incrustado</title>
</head>
<body>
    <h1>Puerto Bahía de Algeciras</h1>
    <p>Ejemplo de <strong>contenido incrustado en HTML5</strong> aplicado al puerto de Algeciras:
       una imagen vectorial (<code>svg</code>), un vídeo de YouTube (<code>iframe</code>) y un
       documento incrustado (<code>object</code> / <code>embed</code>).</p>

    <!-- 1. Contenido incrustado: <iframe> de YouTube -->
    <h3>1. Vídeo de YouTube con &lt;iframe&gt;</h3>
    <iframe width="560" height="315"
            src="https://www.youtube.com/embed/9sCPiTfxuqw"
            title="Autoridad Portuaria Bahía de Algeciras (APBA)"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen></iframe>

    <!-- mapa de Google que ya estaba en la pagina -->
    <h3>Mapa de Google (iframe)</h3>
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3162.1234567890123!2d-5.456789012345678!3d36.12345678901234!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd0c123456789012%3A0xabcdef1234567890!2sPuerto%20de%20Algeciras!5e0!3m2!1ses!2ses!4v1234567890123"
            width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"></iframe>

    <p><a href="extension.html">Ir a la otra página</a></p>
</body>
</html>

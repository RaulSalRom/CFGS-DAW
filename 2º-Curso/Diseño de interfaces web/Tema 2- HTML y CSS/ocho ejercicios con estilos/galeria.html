<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<title>Rincones de Algeciras</title>
<style>
  body{font-family:system-ui;margin:1rem;background:#f3ece1;color:#1c2b33}
  h1{color:#0d3b66}
  .grid{
    display:grid;
    gap:1rem;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  }
  figure{margin:0;border:1px solid #c9d8dd;padding:.5rem;border-radius:4px;background:#fff}
  img{display:block;width:100%;height:auto;border-radius:2px}
  figcaption{text-align:center;margin-top:.4rem;font-size:.9rem;color:#4a5a63}
</style>
</head>
<body>
  <h1>Rincones de Algeciras</h1>
  <section class="grid">
    <figure>
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/29/Plaza_Alta%2C_Algeciras%2C_C%C3%A1diz%2C_Espa%C3%B1a%2C_2015-12-09%2C_DD_02.JPG/960px-Plaza_Alta%2C_Algeciras%2C_C%C3%A1diz%2C_Espa%C3%B1a%2C_2015-12-09%2C_DD_02.JPG" alt="Plaza Alta de Algeciras con sus arcos y farolas" width="100%" />
      <figcaption>Plaza Alta · Foto: Diego Delso (CC BY-SA 4.0)</figcaption>
    </figure>
    <figure>
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c9/Embarque_puerto_de_Algeciras.jpg/960px-Embarque_puerto_de_Algeciras.jpg" alt="Embarque de vehículos en el puerto de Algeciras" />
      <figcaption>Puerto de Algeciras · Foto: Xemenendura (CC BY-SA 4.0)</figcaption>
    </figure>
    <figure>
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/8d/Getares.jpg/960px-Getares.jpg" alt="Playa de Getares junto a Punta Carnero" />
      <figcaption>Playa de Getares · Foto: Falconaumanni (CC BY-SA 3.0)</figcaption>
    </figure>
    <figure>
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b7/Fuerte_de_Isla_Verde_%2811%29.JPG/960px-Fuerte_de_Isla_Verde_%2811%29.JPG" alt="Fuerte de Isla Verde, en la bahía de Algeciras" />
      <figcaption>Fuerte de Isla Verde · Foto: Falconaumanni (CC BY-SA 3.0)</figcaption>
    </figure>
    <figure>
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c8/Parque_Mar%C3%ADa_Cristina_Algeciras_2024_%282%29.jpg/960px-Parque_Mar%C3%ADa_Cristina_Algeciras_2024_%282%29.jpg" alt="Paseo y vegetación del parque María Cristina" />
      <figcaption>Parque María Cristina · Foto: Falconaumanni (CC BY 4.0)</figcaption>
    </figure>
    <figure>
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/da/R%C3%ADo_de_la_miel_algeciras_02.jpg/960px-R%C3%ADo_de_la_miel_algeciras_02.jpg" alt="Sendero junto al río de la Miel" />
      <figcaption>Río de la Miel · Foto: Antonio M. Romero Dorado (dominio público)</figcaption>
    </figure>
  </section>
</body>
</html>

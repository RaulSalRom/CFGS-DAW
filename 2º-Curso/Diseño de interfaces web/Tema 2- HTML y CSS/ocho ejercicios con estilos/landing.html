<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<title>MareTech Cloud</title>
<style>
  :root{--prim:#06b6d4}
  *{box-sizing:border-box}
  body{font-family:system-ui,sans-serif;display:flex;flex-direction:column;
       align-items:center;justify-content:center;text-align:center;height:100vh;margin:0;padding:1rem;
       background:#0b1220;color:#e2e8f0}
  h1{font-size:3rem;margin:.5rem 0;color:#f8fafc}
  p{font-size:1.25rem;color:#94a3b8;margin:0 0 1.5rem}
  button{display:flex;align-items:center;gap:.6rem;padding:.8rem 1.6rem;
         font-size:1rem;font-weight:700;border:none;border-radius:8px;
         background:var(--prim);color:#0b1220;cursor:pointer;transition:transform .3s}
  button:hover,button:focus{transform:scale(1.05);background:#22d3ee}
  @media (prefers-reduced-motion: reduce){
    button{transition:none}
  }
</style>
</head>
<body>
  <h1>Próximamente: MareTech Cloud</h1>
  <p>Déjanos avisarte cuando abramos la beta</p>
  <button>
    <span aria-hidden="true">🔔</span>
    Avísame
  </button>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<title>Museo de Historia de Algeciras</title>
<style>
  :root{--prim:#5a3e2b}
  *{box-sizing:border-box}
  body{font-family:system-ui,sans-serif;display:flex;flex-direction:column;
       align-items:center;justify-content:center;text-align:center;height:100vh;margin:0;padding:1rem;
       background:#f6efe1;color:#3f2f22}
  h1{font-family:Georgia,serif;font-size:3rem;margin:.5rem 0;color:#5a3e2b}
  p{font-size:1.25rem;color:#7a6553;margin:0 0 1.5rem}
  button{display:flex;align-items:center;gap:.6rem;padding:.8rem 1.6rem;
         font-size:1rem;border:none;border-radius:8px;background:var(--prim);color:#fff;
         cursor:pointer;transition:transform .3s}
  button:hover,button:focus{transform:scale(1.05);background:#b8892b}
  @media (prefers-reduced-motion: reduce){
    button{transition:none}
  }
</style>
</head>
<body>
  <h1>Próximamente: Museo de Historia de Algeciras</h1>
  <p>Déjanos avisarte cuando abramos sus puertas</p>
  <button>
    <span aria-hidden="true">🔔</span>
    Avísame
  </button>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Reserva tu visita a MareTech</title>
  <style>
    body{font-family:system-ui;margin:1rem;max-width:600px;background:#f1f5f9;color:#0f172a}
    h1{font-size:1.6rem;color:#0b1220}
    fieldset{border:13px solid #cbd5e1;padding:1rem;border-radius:8px;background:#fff;}
    legend{font-weight:600;color:#2563eb;padding:0 .3rem}
    label{display:block;margin-top:.7rem}
    input[type=text],input[type=email],input[type=date]{
      width:100%;padding:.5rem;border:1px solid #cbd5e1;border-radius:4px;margin-top:.2rem}
    input[type=range]{width:100%;accent-color:#2563eb}
    small{color:#64748b}
    button{margin-top:1rem;padding:.6rem 1.2rem;border:none;border-radius:6px;
           background:#2563eb;color:#fff;font-weight:600;cursor:pointer}
    button:hover,button:focus{background:#1d4ed8}

  /* ── Barra de navegación entre los ocho ejercicios ── */
  body{box-sizing:border-box;padding-top:5rem}
  .nav-ejercicios{position:fixed;top:0;left:0;right:0;z-index:999;
    display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin:0;border:0;
    padding:.6rem .8rem;font-family:system-ui,sans-serif;
    background:rgba(13,59,102,.94);box-shadow:0 2px 12px rgba(0,0,0,.25)}
  .nav-ejercicios a{margin:0;padding:.35rem .75rem;border:1px solid #f3ece1;border-radius:6px;
    background:#f3ece1;color:#0d3b66;font-size:.82rem;font-weight:600;
    text-decoration:none;transition:background .2s,color .2s,transform .2s}
  .nav-ejercicios a:hover,.nav-ejercicios a:focus{
    background:#0d3b66;color:#f3ece1;transform:translateY(-2px)}
  .nav-ejercicios a[aria-current="page"]{background:#0d3b66;color:#f3ece1;cursor:default}
</style>
</head>
<body>
  <nav class="nav-ejercicios" aria-label="Ejercicios del tema 2">
    <a href="landing.html">Landing</a>
    <a href="noticia.html">Noticia</a>
    <a href="reserva.html" aria-current="page">Reserva</a>
    <a href="video.html">Vídeo</a>
    <a href="cards.html">Cards</a>
    <a href="galeria.html">Galería</a>
    <a href="horario.html">Horario</a>
    <a href="404.html">404</a>
  </nav>
  <h1>Reserva tu visita a MareTech</h1>

  <form action="#" aria-describedby="ayuda-nivel"; style="border: 10px solid black";>
    <fieldset>
      <legend>Jornada de puertas abiertas · Datos de la visita</legend>

      <label>Nombre
        <input type="text" name="nombre" required />
      </label>

      <label>E‑mail
        <input type="email" name="email" required />
      </label>

      <label>Fecha
        <input type="date" name="fecha" required />
      </label>

      <p>Turno</p>
      <label><input type="radio" name="turno" value="mañana" required /> Mañana</label>
      <label><input type="radio" name="turno" value="tarde"  required /> Tarde</label>

      <label>Número de visitantes (1–10)
        <input type="range" name="visitantes" min="1" max="10" value="2" aria-describedby="ayuda-nivel" />
      </label>
      <small id="ayuda-nivel">Indica cuántas personas venís en el grupo.</small>

      <label>
        <input type="checkbox" name="sesion-ingles" /> Añadir sesión en inglés
      </label>
    </fieldset>

    <button type="submit">Reservar visita</button>
  </form>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Reserva tu visita a MareTech</title>
  <style>
    body{font-family:system-ui;margin:1rem;max-width:600px;background:#f1f5f9;color:#0f172a}
    h1{font-size:1.6rem;color:#0b1220}
    fieldset{border:1px solid #cbd5e1;padding:1rem;border-radius:8px;background:#fff}
    legend{font-weight:600;color:#2563eb;padding:0 .3rem}
    label{display:block;margin-top:.7rem}
    input[type=text],input[type=email],input[type=date]{
      width:100%;padding:.5rem;border:1px solid #cbd5e1;border-radius:4px;margin-top:.2rem}
    input[type=range]{width:100%;accent-color:#2563eb}
    small{color:#64748b}
    button{margin-top:1rem;padding:.6rem 1.2rem;border:none;border-radius:6px;
           background:#2563eb;color:#fff;font-weight:600;cursor:pointer}
    button:hover,button:focus{background:#1d4ed8}
  </style>
</head>
<body>
  <h1>Reserva tu visita a MareTech</h1>

  <form action="#" aria-describedby="ayuda-nivel">
    <fieldset>
      <legend>Jornada de puertas abiertas · Datos de la visita</legend>

      <label>Nombre
        <input type="text" name="nombre" required />
      </label>

      <label>E‑mail
        <input type="email" name="email" required />
      </label>

      <label>Fecha
        <input type="date" name="fecha" required />
      </label>

      <p>Turno</p>
      <label><input type="radio" name="turno" value="mañana" required /> Mañana</label>
      <label><input type="radio" name="turno" value="tarde"  required /> Tarde</label>

      <label>Número de visitantes (1–10)
        <input type="range" name="visitantes" min="1" max="10" value="2" aria-describedby="ayuda-nivel" />
      </label>
      <small id="ayuda-nivel">Indica cuántas personas venís en el grupo.</small>

      <label>
        <input type="checkbox" name="sesion-ingles" /> Añadir sesión en inglés
      </label>
    </fieldset>

    <button type="submit">Reservar visita</button>
  </form>
</body>
</html>

<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raul Sal Romeo</title>
  <style>
    body {
      background-color: #f5f5f5;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .carousel-container {
      width: 600px;
      background: white;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    }

    .scroll-snap-wrapper {
      display: flex;
      overflow-x: auto;
      gap: 10px;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      scrollbar-width: none;
      padding-bottom: 20px;
    }

    .scroll-snap-wrapper::-webkit-scrollbar {
      display: none;
    }

    .slide {
      flex: 0 0 100%;
      scroll-snap-align: center;
      position: relative;
      text-align: center;
    }

    .slide img {
      width: 100%;
      height: 350px;
      object-fit: contain;
      filter: drop-shadow(0 10px 10px rgba(0, 0, 0, 0.2));
    }

    .info {
      margin-top: 10px;
      font-weight: bold;
      color: #333;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding: 10px;
      background: #111;
      border-radius: 50px;
    }

    .btn {
      color: white;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #333;
    }

    .btn.disabled {
      opacity: 0.3;
      cursor: default;
      pointer-events: none;
    }

    .dynamic-group {
      position: relative;
      width: 40px;
      height: 40px;
    }

    .dynamic-group .btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 8px 14px;
      display: none;
    }

    .default-start {
      display: block !important;
    }

    .placeholder {
      display: block !important;
    }

    body:has(#n1:target) .controls .next.to-n2 {
      display: block !important;
    }

    body:has(#n1:target) .controls .default-start {
      display: none !important;
    }

    body:has(#n2:target) .controls .prev.to-n1 {
